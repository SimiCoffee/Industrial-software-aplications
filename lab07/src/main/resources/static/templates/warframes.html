<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Warframes</title>
  </head>
  <body>
    <h1>Warframes</h1>
    <a th:href="@{/warframes/add}">Add New Warframe</a>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Health</th>
          <th>Shields</th>
          <th>Armor</th>
          <th>Energy</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="warframe : ${warframes}">
          <td th:text="${warframe.name}"></td>
          <td th:text="${warframe.health}"></td>
          <td th:text="${warframe.shields}"></td>
          <td th:text="${warframe.armor}"></td>
          <td th:text="${warframe.energy}"></td>
          <td>
            <a th:href="@{/warframes/edit/{id}(id=${warframe.id})}">Edit</a>
            <a th:href="@{/warframes/delete/{id}(id=${warframe.id})}">Delete</a>
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
