<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Add Warframe</title>
  </head>
  <body>
    <h1>Add New Warframe</h1>
    <form th:action="@{/warframe/add}" th:object="${warframe}" method="post">
      <!-- Name Field -->
      <label for="name">Name:</label>
      <input type="text" id="name" th:field="*{name}" />
      <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
        Name Error
      </div>
      <br />

      <!-- Health Field -->
      <label for="health">Health:</label>
      <input type="number" id="health" th:field="*{health}" />
      <div th:if="${#fields.hasErrors('health')}" th:errors="*{health}">
        Health Error
      </div>
      <br />

      <!-- Shields Field -->
      <label for="shields">Shields:</label>
      <input type="number" id="shields" th:field="*{shields}" />
      <div th:if="${#fields.hasErrors('shields')}" th:errors="*{shields}">
        Shields Error
      </div>
      <br />

      <!-- Armor Field -->
      <label for="armor">Armor:</label>
      <input type="number" id="armor" th:field="*{armor}" />
      <div th:if="${#fields.hasErrors('armor')}" th:errors="*{armor}">
        Armor Error
      </div>
      <br />

      <!-- Energy Field -->
      <label for="energy">Energy:</label>
      <input type="number" id="energy" th:field="*{energy}" />
      <div th:if="${#fields.hasErrors('energy')}" th:errors="*{energy}">
        Energy Error
      </div>
      <br />

      <!-- Release Date Field -->
      <label for="releaseDate">Release Date:</label>
      <input type="date" id="releaseDate" th:field="*{releaseDate}" />
      <div
        th:if="${#fields.hasErrors('releaseDate')}"
        th:errors="*{releaseDate}"
      >
        Release Date Error
      </div>
      <br />

      <!-- Is Prime Checkbox -->
      <label for="isPrime">Is Prime:</label>
      <input type="checkbox" id="isPrime" th:field="*{isPrime}" />
      <br />

      <button type="submit">Add Warframe</button>
    </form>
    <a href="/warframe">Back to Home</a>
  </body>
</html>
