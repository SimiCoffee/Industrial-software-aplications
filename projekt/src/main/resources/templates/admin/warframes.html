<!doctype html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Lista Warframe'ów - Admin</title>
    <link rel="stylesheet" href="/css/dark-theme.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="navigation">
      <a href="/admin" class="btn btn-secondary">Panel administratora</a>
      <a href="/admin/players" class="btn btn-primary">Zobacz listę graczy</a>
    </div>
    <div class="container">
      <h2 class="mt-4">Lista Warframe'ów</h2>
      <a href="/admin/warframes/new" class="btn btn-success mb-3"
        >Dodaj Warframe</a
      >

      <table class="table table-striped">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nazwa</th>
            <th>Zdrowie</th>
            <th>Pancerz</th>
            <th>Energia</th>
            <th>Akcje</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="warframe : ${warframes}">
            <td th:text="${warframe.id}"></td>
            <td th:text="${warframe.name}"></td>
            <td th:text="${warframe.health}"></td>
            <td th:text="${warframe.armor}"></td>
            <td th:text="${warframe.energy}"></td>
            <td>
              <form
                th:action="@{/admin/warframes/delete/{id}(id=${warframe.id})}"
                method="post"
              >
                <button type="submit" class="btn btn-danger btn-sm">
                  Usuń
                </button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
