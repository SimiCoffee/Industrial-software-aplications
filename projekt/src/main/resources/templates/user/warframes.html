<!doctype html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Warframe'y - Użytkownik</title>
    <link rel="stylesheet" href="/css/dark-theme.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="container">
      <h2 class="mt-4">Lista Warframe'ów</h2>

      <table class="table table-striped">
        <thead>
          <tr>
            <th>Nazwa</th>
            <th>Zdrowie</th>
            <th>Pancerz</th>
            <th>Energia</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="warframe : ${warframes}">
            <td th:text="${warframe.name}"></td>
            <td th:text="${warframe.health}"></td>
            <td th:text="${warframe.armor}"></td>
            <td th:text="${warframe.energy}"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
